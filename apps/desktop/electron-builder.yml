appId: com.chatter.desktop
productName: Chatter
copyright: Chatter contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# chatter-engine (crates/chatter-engine), built with `cargo build --release`
# before packaging; the app looks for it in resources/bin.
win:
  extraResources:
    - from: ../../target/release/chatter-engine.exe
      to: bin/chatter-engine.exe
  target:
    - target: nsis
      arch: [x64]
  executableName: Chatter
nsis:
  # No spaces: GitHub turns them into dots on upload, and latest.yml expects dashes.
  artifactName: Chatter-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # The Start Menu shortcut carries the AppUserModelID that Windows toasts need.
  createStartMenuShortcut: true
  shortcutName: Chatter
linux:
  extraResources:
    - from: ../../target/release/chatter-engine
      to: bin/chatter-engine
  target:
    - AppImage
    - deb
  category: Network
  executableName: chatter-desktop
  synopsis: Desktop client for Chatter
  maintainer: Chatter contributors
  desktop:
    entry:
      StartupWMClass: Chatter
deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libasound2
    - libpulse0
appImage:
  artifactName: Chatter-${version}-${arch}.AppImage
# chatter:// links (invites, message links). Windows registers at runtime.
protocols:
  - name: Chatter
    schemes: [chatter]
# Updates come from this repository's GitHub Releases. 0.1.0 was built when it
# was ChristianVaughn/Chatter-Desktop and finds updates only through GitHub's
# redirect from that name (see docs/RELEASING.md).
publish:
  provider: github
  owner: Chatter-Org
  repo: Chatter-Desktop
