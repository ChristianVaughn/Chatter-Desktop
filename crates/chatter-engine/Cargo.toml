[package]
name = "chatter-engine"
description = "Chatter's native media engine: voice, devices and push-to-talk, driven by the desktop app over stdio."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
chatter-appaudio = { path = "../chatter-appaudio" }
chatter-hotkeys = { path = "../chatter-hotkeys" }
chatter-media = { path = "../chatter-media" }
anyhow = "1"
cpal = "0.18"
crossbeam-channel = "0.5"
env_logger = "0.11"
futures-executor = "0.3"
futures-util = "0.3"
hound = "3.5"
log = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
parking_lot = "0.12"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

# Linux: PulseAudio (which PipeWire also serves) rather than raw ALSA, so the
# default device follows the desktop's choice. Needs libpulse-dev to build.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
