[package]
name = "chatter-testclient"
description = "Headless Chatter voice client used to prove the native media stack against a real server."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
chatter-media = { path = "../chatter-media" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
hound = "3.5"
log = "0.4"
regex = "1"
# rustls only: libwebrtc carries its own BoringSSL, and linking OpenSSL next to
# it is a known source of symbol clashes on Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
totp-rs = "5"
url = "2"
