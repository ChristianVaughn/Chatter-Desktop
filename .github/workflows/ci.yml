name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 rather than latest so the Linux builds run on older glibc.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy, rustfmt

      # The prebuilt libwebrtc ships Chromium's hermetic libc++, which needs
      # clang 21 or newer; distro clang on 22.04 is 14. The engine's audio
      # (cpal: ALSA + PulseAudio) and push-to-talk (X11 XInput2, D-Bus portal)
      # need their headers.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxi-dev libdbus-1-dev xvfb
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build the engine for packaging
        run: cargo build --release -p chatter-engine

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract matches the Chatter client
        run: node scripts/sync-contract.mjs --check
      - run: npm run typecheck
      - run: npm run build

      - name: Engine protocol tests (fake audio devices)
        run: npx playwright test e2e/engine.spec.ts
        working-directory: apps/desktop
        env:
          CHATTER_ENGINE_PATH: ${{ github.workspace }}/target/release/${{ runner.os == 'Windows' && 'chatter-engine.exe' || 'chatter-engine' }}

      - name: Shell smoke tests (headless on Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test e2e/smoke.spec.ts
        working-directory: apps/desktop

      # Installers people can try straight from the run: the NSIS setup on
      # Windows, the AppImage and .deb on Linux. Plus what the auto-updater
      # reads (latest*.yml, blockmaps), which release.yml publishes from here.
      - name: Package
        run: npx electron-builder --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: chatter-desktop-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
