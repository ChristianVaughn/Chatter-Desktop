name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 rather than latest so the Linux builds run on older glibc.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package (unpacked)
        run: npm run dist:dir -w apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -w apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: chatter-desktop-${{ matrix.os }}
          path: apps/desktop/dist/*-unpacked
          retention-days: 7

  native:
    name: Native media (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      # Keep in step with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy, rustfmt

      # The prebuilt libwebrtc ships Chromium's hermetic libc++, which needs
      # clang 21 or newer; distro clang on 22.04 is 14.
      - name: Install clang 21 and glib headers (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get install -y libglib2.0-dev pkg-config
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
